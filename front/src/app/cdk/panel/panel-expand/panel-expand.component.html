<div class="amstore-panel-header" (click)="changeState()">
    <div class="amstore-panel-header-wrapper">
        <ng-content select="amstore-panel-header"/>
    </div>

    @if (clickable()) {
        <amstore-divider [contrast]="true" side="horizontal"/>
        <amstore-icon [iconName]="state() ? 'chevrone-up' : 'chevrone-down'" [contrast]="true" [size]="20"/>
    }
</div>

<div class="amstore-panel-content" [@expand]="expandState">
    <div class="amstore-panel-content-wrapper">
        <ng-content/>
    </div>
</div>
