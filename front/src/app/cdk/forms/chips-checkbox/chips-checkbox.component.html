<ng-content selector="amstore-forms-label"/>

@if (itemList$ | async; as itemList) {
    <div class="amstore-chips-checkbox-list">
        @for (item of itemList; track item) {
            <amstore-chip size="large" (click)="change(item.checked, item.item.value)" [stroked]="!item.checked" [color]="color()">
                <mat-checkbox [checked]="item.checked"
                              class="amstore-checkbox"
                              [attr.class]="colorClass()"
                              (click)="$event.preventDefault()"/>

                <span>{{item.item.label}}</span>
            </amstore-chip>
        }
    </div>
}
