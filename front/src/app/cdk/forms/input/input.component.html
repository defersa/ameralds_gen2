<mat-form-field>
    @if (label()) {
        <mat-label>
            {{ label() }}
        </mat-label>
    }

    <input matInput [type]="type()" [formControl]="control" [name]="name()" [autocomplete]="autocomplete()"
           ngDefaultControl
           [required]="required()">

    @if (suffixName()) {
        <amstore-icon (click)="emitSuffixClick()"
                      [iconName]="suffixName()"
                      [size]="20"
                      color="accent"
                      matSuffix />
    }

    @if (errorStatusChanges$ | async) {
        <mat-error>
            {{ control.errors | errors }}
        </mat-error>
    }
</mat-form-field>
