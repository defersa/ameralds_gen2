<div class="amstore-pattern-card-actions">
    <amstore-button [stroked]="true" (click)="getBack()">Назад</amstore-button>

    <amstore-button
        [routerLink]="['/', 'admin', 'patterns', id, 'edit']"
        [stroked]="true"
        color="accent">Изменить</amstore-button>
</div>

@if (pattern$ | async; as pattern) {
    <amstore-pattern-card [pattern]="pattern"/>
}
