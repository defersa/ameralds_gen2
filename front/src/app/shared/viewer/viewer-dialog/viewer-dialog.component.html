<div class="amstore-viewer-main-image">
    <div (click)="prevImage($event)">
        <amstore-icon iconName="left-arrow" [size]="32" [contrast]="true"/>
    </div>

    <img [src]="data.images[data.index].full">

    <div (click)="nextImage($event)">
        <amstore-icon iconName="right-arrow" [size]="32" [contrast]="true"/>
    </div>
</div>

<div class="amstore-viewer-snippet-images">
    @for (image of data.images; track image) {
        <img [src]="image.preview" [class.image-active]="$index === data.index" (click)="goToIndex($index, $event)">
    }
</div>
