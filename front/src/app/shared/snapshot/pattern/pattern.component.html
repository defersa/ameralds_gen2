<div class="amstore-snapshot-images">
    @if (pattern().images[0]) {
        <img [outsideSrc]="pattern().images[0].image_full" (click)="openViewer(pattern().images, 0)">
    }
</div>

<div class="amstore-snapshot-container">
    <div class="amstore-snapshot-container-header">
        <h2 [routerLink]="routerLink()">
            <amstore-lang-text [text]="pattern().name"/>
        </h2>
    </div>

    <ng-content/>
</div>
