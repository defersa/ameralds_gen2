<amstore-panel [color]="color()"  [formGroup]="filterForm">
    <amstore-panel-header class="amstore-filter-header">
        Фильтры

        @if (!isEmpty) {
            <amstore-button (click)="clearFilters($event)" [color]="color()">
                Очистить

                <amstore-icon [contrast]="true" [iconName]="'cross'" [size]="20"/>
            </amstore-button>
        }
    </amstore-panel-header>

    <div class="row">
        <div class="col-6">
            <amstore-forms-input formControlName="search">Поиск</amstore-forms-input>
        </div>

        <div class="col-6">
<!--                <amstore-form-select>Сортировка</amstore-form-select>-->
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <amstore-chips-checkbox [items]="categoriesList$ | async" formControlName="categories" [color]="color()" label="Категории"/>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <amstore-chips-checkbox [items]="sizesList$ | async" formControlName="sizes" [color]="color()" label="Размер"/>
        </div>
    </div>

    <div class="row amstore-filter-buttons">
        <div class="col-12 text-right">
            @if (!isEmpty) {
                <amstore-button color="warn" (click)="clearFilters($event)">
                    Очистить
                </amstore-button>
            }

            <amstore-button [stroked]="true" color="warn" [disabled]="!isChanged" (click)="resetFilters()">
                Отменить
            </amstore-button>

            <amstore-button [disabled]="!isChanged" [color]="color()" (click)="setFilters()">
                Найти
            </amstore-button>
        </div>
    </div>
</amstore-panel>
