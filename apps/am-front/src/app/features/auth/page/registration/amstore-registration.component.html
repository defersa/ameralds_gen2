<amstore-panel-basic class="container">
    <h1 class="mb-8!">
        Регистрация нового пользователя
    </h1>

    <form class="flex flex-col gap-4" name="registration" (submit)="sendUser($event)" novalidate>
        <amstore-input-signal type="email"
                              autocomplete="username"
                              label="Email"
                              [formField]="regForm.email"/>

        <amstore-input-signal autocomplete="new-password"
                              label="Пароль"
                              [type]="passwordVisible() ? 'text' : 'password'"
                              [suffixName]="passwordVisible() ? 'eye-off' : 'eye-on'"
                              [formField]="regForm.password"
                              (onSuffixClick)="togglePasswordVisibility(false)"/>

        <amstore-input-signal autocomplete="new-password"
                              label="Повторите пароль"
                              [type]="passwordRepeatVisible() ? 'text' : 'password'"
                              [suffixName]="passwordRepeatVisible() ? 'eye-off' : 'eye-on'"
                              [formField]="regForm.passwordRepeat"
                              (onSuffixClick)="togglePasswordVisibility(true)"/>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <amstore-input-signal autocomplete="given-name"
                                  label="Имя"
                                  [formField]="regForm.firstName"/>

            <amstore-input-signal autocomplete="family-name"
                                  label="Фамилия"
                                  [formField]="regForm.lastName"/>
        </div>

        <amstore-checkbox-signal [formField]="regForm.isAccept"
                                 label="Я согласен с условиями регистрации"/>

        @if (requestError(); as error) {
            <p role="alert">
                {{ error }}
            </p>
        }

        <button amstore-button-round
                class="mt-6 w-full"
                type="submit"
                [disabled]="!model().isAccept || createRequest.loading()">
            {{ createRequest.loading() ? 'Подождите…' : 'Зарегистрироваться' }}
        </button>
    </form>
</amstore-panel-basic>
