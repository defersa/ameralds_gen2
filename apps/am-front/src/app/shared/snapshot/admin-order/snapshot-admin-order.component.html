<div>
    <div class="snapshot-order__logo">
        <amstore-icon iconName="apply" [contrast]="true" [size]="64" />
    </div>
</div>

<div>
    <h2 class="snapshot-order__header" [routerLink]="routerLink()">Заказ №{{ order().id }}</h2>

    <div class="snapshot-order__title">
        <amstore-icon iconName="profile" [size]="20" color="special" />

        Email:
        <span class="value">
            {{ order().email }}
        </span>
    </div>

    <div class="snapshot-order__title">
        <amstore-icon iconName="time" [size]="20" color="special" />

        Дата заказа:
        <span class="value">
            {{ order().create_date | date : 'YYYY.MM.dd HH:mm.SS' }}
        </span>
    </div>

    <div class="snapshot-order__title">
        <amstore-icon iconName="order" [size]="20" color="special" />

        Покупки:
        @for (purchase of order().purchases; track purchase) {
            <div class="snapshot-order__purchase">

            <span class="value">
                - <amstore-lang-text [text]="purchase.pattern.name"/>
            </span>
                , размеры
                <span class="value">
                    {{ purchase.sizes.join(',') }}
                </span>
            </div>
        }
    </div>
</div>
