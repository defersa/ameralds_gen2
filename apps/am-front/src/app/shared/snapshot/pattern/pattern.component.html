<div class="amstore-snapshot-images">
    @if (pattern()?.images[0]) {
        <img [src]="pattern().images[0].preview" (click)="openViewer(pattern().images, 0)">
    }
</div>

<div class="amstore-snapshot-container">
    <div class="amstore-snapshot-container-header mb-2">
        <h2 [routerLink]="routerLink()">
            @if (pattern().name) {
                <amstore-lang-text [text]="pattern().name"/>
            }

            @else {
                Схема недоступна
            }
        </h2>
    </div>

    <ng-content/>
</div>
