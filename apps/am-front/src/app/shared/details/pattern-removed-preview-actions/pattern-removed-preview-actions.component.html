<div class="amstore-short-line flex flex-row gap-1 p-1">
    <mat-icon fontIcon="style" class="amstore-text-primary"/>:

    <div class="pl-1"></div>

    @for (category of categories(); track category) {
        <amstore-chip [isDark]="true">
            {{category.label}}
        </amstore-chip>
    }
</div>


@if (cartStatus(); as cart) {
    <div class="amstore-short-line flex flex-row gap-1 p-1">
        <mat-icon fontIcon="straighten" class="amstore-text-primary"/>:

        <div class="pl-1"></div>

        @for (size of cart.sizes; track size.id) {
            <amstore-chip>
                {{size.value}}
            </amstore-chip>
        }
    </div>

    @if (cart.color;) {
        <div class="p-1 amstore-text-caption flex flex-row gap-1 items-center">
            <mat-icon fontIcon="invert_colors" class="amstore-text-primary"/>:

            <div class="pl-1"></div>

            Подбор в корзине
        </div>
    }
}

<div class="p-2 text-right flex flex-row gap-2 justify-end">
    @if (price().ru; as price) {
        <h4>
            {{ price }} {{ currency() }}
        </h4>
    }

    <ng-content/>
</div>
