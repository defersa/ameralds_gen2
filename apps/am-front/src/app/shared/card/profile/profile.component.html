<amstore-panel color="accent" [state]="true" [clickable]="false">
    <amstore-panel-header>
        <h1>Пользователь №{{ user().id }}</h1>
    </amstore-panel-header>

    <div class="grid grid-cols-1 gap-7 sm:grid-cols-[200px_minmax(0,1fr)]">
        <img class="amstore-profile-card__image mx-auto size-50 max-w-full object-cover sm:mx-0"
             src="assets/no-profile-image.png" alt="Изображение профиля" width="200" height="200">

        <div class="flex min-w-0 flex-col items-stretch gap-6 pt-2 sm:pr-4">
            <amstore-input-signal [formField]="profileForm.username" label="Имя пользователя"
                                  autocomplete="username"/>
            <amstore-input-signal [formField]="profileForm.email" label="Почта" type="email"
                                  autocomplete="email"/>

            <amstore-button class="self-start uppercase" [stroked]="true" color="accent" size="small"
                            [disabled]="true" role="button" aria-disabled="true" tabindex="-1">
                Сменить пароль
            </amstore-button>
        </div>
    </div>

    <div class="mt-12 mb-3 flex justify-end">
        <amstore-button class="uppercase" color="accent" [disabled]="true" role="button" aria-disabled="true" tabindex="-1">
            Сохранить
        </amstore-button>
    </div>
</amstore-panel>
