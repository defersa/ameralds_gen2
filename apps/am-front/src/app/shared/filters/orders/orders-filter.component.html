<amstore-panel color="special">
    <amstore-panel-header class="amstore-filter-header">
        Фильтры

        @if (hasFilters()) {
            <amstore-button (click)="clearFilters($event)" color="special">
                Очистить

                <amstore-icon [contrast]="true" [iconName]="'cross'" [size]="20"/>
            </amstore-button>
        }
    </amstore-panel-header>

    <div class="flex flex-col gap-4">
        <amstore-input-signal [formField]="filterForm.email" label="Email"/>
        <amstore-input-signal [formField]="filterForm.vk" label="VK"/>

        <amstore-datepicker-signal [formField]="filterForm.startDate" label="Дата заказа с"/>
        <amstore-datepicker-signal [formField]="filterForm.endDate" label="Дата заказа по"/>
    </div>
</amstore-panel>

<ng-content/>

<amstore-paginator (goToPageEvent)="handlePagination($event)" [pageCount]="pagesCount()" [page]="filterSet().page" color="special"/>
