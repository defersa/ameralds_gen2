<h2 mat-dialog-title>Текущий список</h2>
<div class="amstore-image-list-editor">
    @for (image of images(); track image; let i = $index) {
        <div class="amstore-image-list-editor-image-container">

            <img [src]="image.preview"/>

            <div class="flex flex-row gap-4">
                <div (click)="moveImage(i, 'prev')">
                    <amstore-icon role="button" color="accent" iconName="left-arrow"/>
                </div>

                <div (click)="remove(i)">
                    <amstore-icon role="button" color="accent" iconName="cross"/>
                </div>

                <div (click)="moveImage(i, 'next')">
                    <amstore-icon role="button" color="accent" iconName="right-arrow"/>
                </div>
            </div>
        </div>
    }

    <div class="amstore-image-list-editor-image-container" style="order: -1;">
        <input type="file" (change)="dropFiles($event.target)" name="uploadimage" #imageInput style="display: none;">

        <div class="amstore-image-list-editor-actions">
            <amstore-button (click)="callInputDialog()" color="accent">+</amstore-button>
        </div>

        <span style="text-align: center">Добавить новое<br> изображение</span>
    </div>
</div>

<div class='amstore-image-list-editor-button' mat-dialog-actions>
    <amstore-button color="warn" (click)="close()">Отменить</amstore-button>
    <amstore-button color="primary" (click)="close(true)">Сохранить</amstore-button>
</div>
