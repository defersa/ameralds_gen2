<amstore-filters (onSetFilters)="setFilterWithPage($event)" [filters]="filters"/>

@for (item of items$ | async; track item) {
    <amstore-snapshot-pattern [pattern]="item" [routerLink]="[item.id]">
        <amstore-pattern-details-short [pattern]="item" [routerLink]="[item.id]"/>
    </amstore-snapshot-pattern>
}

<amstore-paginator (goToPageEvent)="setFilter({page: $event})" [pageCount]="pageCount" [page]="page"/>
