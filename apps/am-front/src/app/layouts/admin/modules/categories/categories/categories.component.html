<button amstore-button-round color="primary" [routerLink]="['create']">
    <amstore-icon iconName="setting" [contrast]="true" [size]="20"/>
    Создать новую
</button>

<div class="amstore-categories-container">
    @for (item of items$ | async; track item) {
        <div class="amstore-categories-container-row" [routerLink]="['edit', item.id]">
            <div class="amstore-categories-container-col-small">{{item.id}}</div>
            <div class="amstore-categories-container-col-large">{{item.label.ru}}</div>
            <div class="amstore-categories-container-col-large">{{item.label.en}}</div>
            <div class="amstore-categories-container-col-large">{{item.createdAt | date : 'dd.MM.yyyy hh:mm:ss'}}</div>
        </div>
    }
</div>

<amstore-paginator (goToPageEvent)="setFilter({page: $event})" [pageCount]="pageCount" [page]="page"/>
