<mat-form-field>
    <mat-label>
        {{ label() }}
    </mat-label>

    <mat-select [formControl]="control" [multiple]="multiple()">
        @for (item of items(); track item) {
            <mat-option [value]="item.value">{{item.label}}</mat-option>
        }
    </mat-select>

    @if (errorStatusChanges$ | async) {
        <mat-error>
            {{ control.errors | errors }}
        </mat-error>
    }
</mat-form-field>
